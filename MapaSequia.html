    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      padding: 20px;
      width: 300px;
      font-family: system-ui, -apple-system, sans-serif;

      color: #1e293b;
    }

    }

      color: #374151;

    }

      height: 8px;

      height: 20px;

      cursor: pointer;

    .time-slider::-moz-range-thumb {

      border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);

    }
    
    .current-time {

    .legend {

      background: rgba(255,255,255,0.95);

      padding: 15px;

      height: 16px;
      border-radius: 3px;

      const current = new Date(start);
      
      while (current <= end) {
        times.push(new Date(current));
        current.setMonth(current.getMonth() + 1);

      return times;

    // Create drought patterns for Mexico using proper geographic zones
    function createDroughtPattern(date) {
      const month = date.getMonth();
      const year = date.getFullYear();
      
      // Seasonal variation (dry season: Nov-Apr, wet season: May-Oct)
      const isDrySeason = month >= 10 || month <= 3;
      const seasonalFactor = isDrySeason ? 1.3 : 0.7;
      
      // Multi-year drought cycles
      const cyclePhase = (year - 2020) % 4;
      const cycleFactors = [1.5, 1.2, 0.8, 0.6]; // Peak, high, low, recovery
      const cycleFactor = cycleFactors[cyclePhase];
      
      const droughtZones = [];
      
      mexicanRegions.forEach(region => {
        const finalIntensity = Math.min(1.0, region.baseIntensity * seasonalFactor * cycleFactor);
        
        if (finalIntensity > 0.1) {
          const droughtLevel = Math.floor(finalIntensity * 4); // 0-4 scale
          const colors = ['#e6f3ff', '#ffffcc', '#ffd966', '#ffb366', '#ff8c66', '#ff6666'];
          const color = colors[droughtLevel] || colors[0];
          
          // Create polygon for each region
          const polygon = L.polygon(region.coordinates, {
            color: '#333',
            weight: 1,
            fillColor: color,
            fillOpacity: 0.7,
            opacity: 0.8
          });
          
          const levelNames = ['Normal', 'D0', 'D1', 'D2', 'D3', 'D4'];
          polygon.bindTooltip(`${region.name}<br>${levelNames[droughtLevel]}<br>${formatDate(date)}`, {
            permanent: false,
            direction: 'top'
          });
          
          droughtZones.push(polygon);
        }
      });
      
      return droughtZones;
    }

    // Format date for display
    function formatDate(date) {
      return date.toISOString().slice(0, 7); // YYYY-MM
    }

    // Update map with new drought pattern
    function updateDroughtMap(date) {
      // Remove existing layer
      if (currentDroughtLayer) {
        map.removeLayer(currentDroughtLayer);
      }
      
      // Create new drought pattern
      const droughtZones = createDroughtPattern(date);
      currentDroughtLayer = L.layerGroup(droughtZones);
      currentDroughtLayer.addTo(map);
      
      // Update time display
      currentTimeDisplay.textContent = formatDate(date);
    }

    // Handle slider change
    timeSlider.addEventListener('input', function() {
      const index = parseInt(this.value);
      const date = timeArray[index];
      updateDroughtMap(date);
    });

    // Initialize with middle date
    const initialDate = timeArray[30]; // 2022-06
    updateDroughtMap(initialDate);
