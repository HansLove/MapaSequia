    // Climate change projection factors for 2025-2050
    const climateProjectionFactors = {
      2025: 1.1, 2026: 1.15, 2027: 1.2, 2028: 1.25, 2029: 1.3, 2030: 1.35,
      2031: 1.4, 2032: 1.45, 2033: 1.5, 2034: 1.55, 2035: 1.6, 2036: 1.65,
      2037: 1.7, 2038: 1.75, 2039: 1.8, 2040: 1.85, 2041: 1.9, 2042: 1.95,
      2043: 2.0, 2044: 2.05, 2045: 2.1, 2046: 2.15, 2047: 2.2, 2048: 2.25,
      2049: 2.3, 2050: 2.35
    };

    // Drought Calculator Class
    class DroughtCalculator {
      constructor() {
        this.states = mexicanStates;
        this.climateFactors = climateProjectionFactors;
      }

      generateTimeArray() {
        const times = [];
        const start = new Date('2020-01-01');
        const end = new Date('2050-12-01');
        const current = new Date(start);
        
        while (current <= end) {
          times.push(new Date(current));
          current.setMonth(current.getMonth() + 1);
        }
        return times;
      }

      calculateDroughtIntensity(state, date) {
        const month = date.getMonth();
        const year = date.getFullYear();
        
        const isDrySeason = month >= 10 || month <= 3;
        const seasonalFactor = isDrySeason ? 1.3 : 0.7;
        
        const cyclePhase = (year - 2020) % 4;
        const cycleFactors = [1.5, 1.2, 0.8, 0.6];
        const cycleFactor = cycleFactors[cyclePhase];
        
        let climateFactor = 1.0;
        if (year >= 2025) {
          climateFactor = this.climateFactors[year] || 2.35;
        }
        
        const climateZoneModifier = this.getClimateZoneModifier(state.climateZone, year);
        
        const finalIntensity = Math.min(1.0, 
          state.baseIntensity * seasonalFactor * cycleFactor * climateFactor * climateZoneModifier
        );
        
        return finalIntensity;
      }

      getClimateZoneModifier(climateZone, year) {
        const baseModifiers = {
          'desert': 1.0, 'arid': 1.1, 'temperate': 1.2, 'tropical': 1.3
        };
        
        const baseModifier = baseModifiers[climateZone] || 1.0;
        
        if (year >= 2025) {
          const yearsFrom2025 = year - 2025;
          const additionalImpact = yearsFrom2025 * 0.02;
          return baseModifier + additionalImpact;
        }
        
        return baseModifier;
      }

      getDroughtLevel(intensity) {
        return Math.floor(intensity * 4);
      }

      getDroughtLevelName(level) {
        const levelNames = ['Normal', 'D0 - Anormalmente Seco', 'D1 - Sequía Moderada', 'D2 - Sequía Severa', 'D3 - Sequía Extrema', 'D4 - Sequía Excepcional'];
        return levelNames[level] || levelNames[0];
      }

      getHeatMapColor(level, intensity) {
        const colorSchemes = {
          0: { base: '#e6f3ff', gradient: '#cce7ff' },
          1: { base: '#ffffcc', gradient: '#fff2a3' },
          2: { base: '#ffd966', gradient: '#ffcc33' },
          3: { base: '#ffb366', gradient: '#ff9933' },
          4: { base: '#ff8c66', gradient: '#ff6b33' },
          5: { base: '#ff6666', gradient: '#ff3333' }
        };
        
        const scheme = colorSchemes[level] || colorSchemes[0];
        const intensityInLevel = (intensity * 4) % 1;
        return this.interpolateColor(scheme.base, scheme.gradient, intensityInLevel);
      }

      interpolateColor(color1, color2, factor) {
        const hex1 = color1.replace('#', '');
        const hex2 = color2.replace('#', '');
        
        const r1 = parseInt(hex1.substr(0, 2), 16);
        const g1 = parseInt(hex1.substr(2, 2), 16);
        const b1 = parseInt(hex1.substr(4, 2), 16);
        
        const r2 = parseInt(hex2.substr(0, 2), 16);
        const g2 = parseInt(hex2.substr(2, 2), 16);
        const b2 = parseInt(hex2.substr(4, 2), 16);
        
        const r = Math.round(r1 + (r2 - r1) * factor);
        const g = Math.round(g1 + (g2 - g1) * factor);
        const b = Math.round(b1 + (b2 - b1) * factor);
        
        return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
      }

      formatDate(date) {
        return date.toISOString().slice(0, 7);
      }

      getStatesDroughtData(date) {
        return this.states.map(state => {
          const intensity = this.calculateDroughtIntensity(state, date);
          const level = this.getDroughtLevel(intensity);
          const levelName = this.getDroughtLevelName(level);
          const color = this.getHeatMapColor(level, intensity);
          
          return {
            ...state,
            intensity,
            level,
            levelName,
            color,
            date: this.formatDate(date)
          };
        });
      }
    }

    // Map Visualizer Class
    class MapVisualizer {
      constructor(map) {
        this.map = map;
        this.droughtCalculator = new DroughtCalculator();
        this.currentDroughtLayer = null;
        this.animationFrame = null;
      }

      initializeMap() {
        const baseMaps = {
          "Light": L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO'
          }),
          "Dark": L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO'
          }),
          "Satellite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri'
          })
        };

        baseMaps["Light"].addTo(this.map);
        L.control.layers(baseMaps).addTo(this.map);
      }

      createDroughtPolygons(droughtData) {
        const polygons = [];
        
        droughtData.forEach(stateData => {
          if (stateData.intensity > 0.05) {
            const polygon = L.polygon(stateData.coordinates, {
              color: this.getBorderColor(stateData.level),
              weight: this.getBorderWeight(stateData.intensity),
              fillColor: stateData.color,
              fillOpacity: this.getFillOpacity(stateData.intensity),
              opacity: 0.8,
              className: 'drought-polygon'
            });

            polygon.on('mouseover', function(e) {
              this.setStyle({
                weight: 3,
                opacity: 1,
                fillOpacity: 0.9
              });
              this.bringToFront();
            });

            polygon.on('mouseout', function(e) {
              this.setStyle({
                weight: this.options.weight,
                opacity: 0.8,
                fillOpacity: this.options.fillOpacity
              });
            });

            const tooltipContent = this.createTooltipContent(stateData);
            polygon.bindTooltip(tooltipContent, {
              permanent: false,
              direction: 'top',
              className: 'custom-tooltip'
            });

            polygon.bindPopup(this.createPopupContent(stateData), {
              maxWidth: 300,
              className: 'custom-popup'
            });

            polygons.push(polygon);
          }
        });

        return polygons;
      }

      getBorderColor(level) {
        const borderColors = ['#4a90e2', '#f5a623', '#f8e71c', '#ff6b35', '#d0021b', '#9013fe'];
        return borderColors[level] || borderColors[0];
      }

      getBorderWeight(intensity) {
        return Math.max(1, Math.min(3, intensity * 3));
      }

      getFillOpacity(intensity) {
        return Math.max(0.3, Math.min(0.8, intensity * 0.8));
      }

      createTooltipContent(stateData) {
        const intensityPercent = Math.round(stateData.intensity * 100);
        return `
          <div class="tooltip-content">
            <strong>${stateData.name}</strong><br>
            <span class="drought-level">${stateData.levelName}</span><br>
            <span class="intensity">Intensidad: ${intensityPercent}%</span><br>
            <span class="date">${stateData.date}</span>
          </div>
        `;
      }

      createPopupContent(stateData) {
        const intensityPercent = Math.round(stateData.intensity * 100);
        const climateZone = this.getClimateZoneName(stateData.climateZone);
        
        return `
          <div class="popup-content">
            <h3>${stateData.name}</h3>
            <div class="drought-info">
              <div class="info-row">
                <span class="label">Nivel de Sequía:</span>
                <span class="value drought-${stateData.level}">${stateData.levelName}</span>
              </div>
              <div class="info-row">
                <span class="label">Intensidad:</span>
                <span class="value">${intensityPercent}%</span>
              </div>
              <div class="info-row">
                <span class="label">Zona Climática:</span>
                <span class="value">${climateZone}</span>
              </div>
              <div class="info-row">
                <span class="label">Fecha:</span>
                <span class="value">${stateData.date}</span>
              </div>
            </div>
            <div class="drought-bar">
              <div class="drought-fill" style="width: ${intensityPercent}%; background-color: ${stateData.color};"></div>
            </div>
          </div>
        `;
      }

      getClimateZoneName(zone) {
        const zoneNames = {
          'desert': 'Desértico', 'arid': 'Árido', 'temperate': 'Templado', 'tropical': 'Tropical'
        };
        return zoneNames[zone] || zone;
      }

      updateDroughtMap(date) {
        if (this.animationFrame) {
          cancelAnimationFrame(this.animationFrame);
        }

        this.showLoading();

        this.animationFrame = requestAnimationFrame(() => {
          try {
            if (this.currentDroughtLayer) {
              this.map.removeLayer(this.currentDroughtLayer);
            }

            const droughtData = this.droughtCalculator.getStatesDroughtData(date);
            const polygons = this.createDroughtPolygons(droughtData);
            
            this.currentDroughtLayer = L.layerGroup(polygons);
            this.currentDroughtLayer.addTo(this.map);

            this.hideLoading();

            this.map.fire('droughtmap:updated', {
              date: date,
              data: droughtData
            });

          } catch (error) {
            console.error('Error updating drought map:', error);
            this.hideLoading();
          }
        });
      }

      showLoading() {
        if (!document.querySelector('.loading')) {
          const loading = document.createElement('div');
          loading.className = 'loading';
          loading.textContent = 'Cargando datos de sequía...';
          document.body.appendChild(loading);
        }
      }

      hideLoading() {
        const loading = document.querySelector('.loading');
        if (loading) {
          loading.remove();
        }
      }
    }

    // Main Application Class
    class DroughtMapApp {
      constructor() {
        this.droughtCalculator = new DroughtCalculator();
        this.mapVisualizer = null;
        this.map = null;
        this.timeArray = [];
        this.currentTimeIndex = 0;
        this.isAnimating = false;
        this.animationSpeed = 100;
        
        this.initializeApp();
      }

      initializeApp() {
        this.initializeMap();
        this.initializeTimeControls();
        this.initializeEventListeners();
        this.startWithInitialDate();
      }

      initializeMap() {
        this.map = L.map('map', {
          center: [23.6345, -102.5528],
          zoom: 5,
          minZoom: 3,
          maxZoom: 8,
          zoomControl: true,
          scrollWheelZoom: true,
          doubleClickZoom: true,
          boxZoom: true,
          keyboard: true,
          dragging: true,
          touchZoom: true
        });

        this.mapVisualizer = new MapVisualizer(this.map);
        this.mapVisualizer.initializeMap();

        this.map.on('droughtmap:updated', (e) => {
          this.onDroughtMapUpdated(e);
        });
      }

      initializeTimeControls() {
        this.timeArray = this.droughtCalculator.generateTimeArray();
        this.timeSlider = document.getElementById('timeSlider');
        this.currentTimeDisplay = document.getElementById('currentTime');
        
        this.timeSlider.min = 0;
        this.timeSlider.max = this.timeArray.length - 1;
        this.timeSlider.value = Math.floor(this.timeArray.length / 2);
        
        this.updateTimeDisplay();
      }

      initializeEventListeners() {
        this.timeSlider.addEventListener('input', (e) => {
          this.currentTimeIndex = parseInt(e.target.value);
          this.updateDroughtMap();
        });

        const playButton = document.getElementById('playButton');
        if (playButton) {
          playButton.addEventListener('click', () => {
            this.toggleAnimation();
          });
        }

        const resetButton = document.getElementById('resetButton');
        if (resetButton) {
          resetButton.addEventListener('click', () => {
            this.resetToStart();
          });
        }

        const speedControl = document.getElementById('speedControl');
        if (speedControl) {
          speedControl.addEventListener('change', (e) => {
            this.animationSpeed = parseInt(e.target.value);
          });
        }

        document.addEventListener('keydown', (e) => {
          this.handleKeyboardInput(e);
        });

        window.addEventListener('resize', () => {
          setTimeout(() => {
            this.map.invalidateSize();
          }, 100);
        });
      }

      handleKeyboardInput(e) {
        switch(e.key) {
          case 'ArrowLeft':
            e.preventDefault();
            this.previousTime();
            break;
          case 'ArrowRight':
            e.preventDefault();
            this.nextTime();
            break;
          case ' ':
            e.preventDefault();
            this.toggleAnimation();
            break;
          case 'Home':
            e.preventDefault();
            this.goToStart();
            break;
          case 'End':
            e.preventDefault();
            this.goToEnd();
            break;
        }
      }

      updateDroughtMap() {
        const currentDate = this.timeArray[this.currentTimeIndex];
        this.mapVisualizer.updateDroughtMap(currentDate);
        this.updateTimeDisplay();
      }

      updateTimeDisplay() {
        const currentDate = this.timeArray[this.currentTimeIndex];
        this.currentTimeDisplay.textContent = this.droughtCalculator.formatDate(currentDate);
        this.timeSlider.value = this.currentTimeIndex;
      }

      previousTime() {
        if (this.currentTimeIndex > 0) {
          this.currentTimeIndex--;
          this.updateDroughtMap();
        }
      }

      nextTime() {
        if (this.currentTimeIndex < this.timeArray.length - 1) {
          this.currentTimeIndex++;
          this.updateDroughtMap();
        }
      }

      goToStart() {
        this.currentTimeIndex = 0;
        this.updateDroughtMap();
      }

      resetToStart() {
        this.stopAnimation();
        this.goToStart();
      }

      goToEnd() {
        this.currentTimeIndex = this.timeArray.length - 1;
        this.updateDroughtMap();
      }

      toggleAnimation() {
        if (this.isAnimating) {
          this.stopAnimation();
        } else {
          this.startAnimation();
        }
      }

      startAnimation() {
        this.isAnimating = true;
        this.animate();
      }

      stopAnimation() {
        this.isAnimating = false;
      }

      animate() {
        if (!this.isAnimating) return;

        this.nextTime();
        
        if (this.currentTimeIndex >= this.timeArray.length - 1) {
          this.stopAnimation();
          return;
        }

        setTimeout(() => {
          this.animate();
        }, this.animationSpeed);
      }

      onDroughtMapUpdated(e) {
        this.updateStatistics(e.data);
      }

      updateStatistics(droughtData) {
        const totalStates = droughtData.length;
        const affectedStates = droughtData.filter(state => state.intensity > 0.2).length;
        const severeDrought = droughtData.filter(state => state.level >= 3).length;
        const extremeDrought = droughtData.filter(state => state.level >= 4).length;

        const statsElement = document.getElementById('statistics');
        if (statsElement) {
          statsElement.innerHTML = `
            <div class="stat-item">
              <span class="stat-label">Estados Afectados:</span>
              <span class="stat-value">${affectedStates}/${totalStates}</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Sequía Severa:</span>
              <span class="stat-value">${severeDrought}</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Sequía Extrema:</span>
              <span class="stat-value">${extremeDrought}</span>
            </div>
          `;
        }
      }

      startWithInitialDate() {
        this.currentTimeIndex = Math.floor(this.timeArray.length * 0.5);
        this.updateDroughtMap();
      }
    }

    // Initialize app when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      window.droughtMapApp = new DroughtMapApp();
    });
  </script>
</body>
</html>
