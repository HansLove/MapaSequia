<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Simulador de Sequía en México - Simple Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      font-family: Arial, sans-serif;
    }
    
    #map { 
      height: 100vh; 
      width: 100vw;
      background-color: #f0f0f0;
    }
    
    .debug-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <div class="debug-panel">
    <h3>Debug Info:</h3>
    <div id="debug-output"></div>
  </div>
  
  <div id="map"></div>

  <script>
    const debugOutput = document.getElementById('debug-output');
    
    function addDebugInfo(message) {
      debugOutput.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
    }
    
    addDebugInfo('Starting simple test...');
    
    // Test if Leaflet is loaded
    if (typeof L !== 'undefined') {
      addDebugInfo('✓ Leaflet loaded');
      
      // Test map container
      const mapContainer = document.getElementById('map');
      if (mapContainer) {
        addDebugInfo('✓ Map container found');
        addDebugInfo('Dimensions: ' + mapContainer.offsetWidth + 'x' + mapContainer.offsetHeight);
        
        // Create map
        try {
          const map = L.map('map').setView([23.6345, -102.5528], 5);
          addDebugInfo('✓ Map created');
          
          // Add tile layer
          L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO'
          }).addTo(map);
          addDebugInfo('✓ Tile layer added');
          
          // Add test marker
          L.marker([23.6345, -102.5528]).addTo(map)
            .bindPopup('Mexico Center - Test');
          addDebugInfo('✓ Test marker added');
          
          // Test with some Mexican states data
          const testStates = [
            {
              name: "Baja California",
              coordinates: [[[32.7186, -117.1611], [32.7186, -114.6331], [31.8667, -114.6331], [31.8667, -116.6000], [30.5333, -116.6000], [30.5333, -115.9500], [28.0000, -115.9500], [28.0000, -117.1611], [32.7186, -117.1611]]],
              color: '#ff6666'
            },
            {
              name: "Sonora", 
              coordinates: [[[32.7186, -117.1611], [32.7186, -108.0000], [31.8667, -108.0000], [31.8667, -110.0000], [30.5333, -110.0000], [30.5333, -111.0000], [28.0000, -111.0000], [28.0000, -114.6331], [31.8667, -114.6331], [32.7186, -117.1611]]],
              color: '#ff9933'
            }
          ];
          
          testStates.forEach(state => {
            const polygon = L.polygon(state.coordinates, {
              color: '#333',
              weight: 2,
              fillColor: state.color,
              fillOpacity: 0.7
            }).addTo(map);
            
            polygon.bindPopup(state.name);
          });
          
          addDebugInfo('✓ Test polygons added');
          addDebugInfo('Map test completed successfully!');
          
        } catch (error) {
          addDebugInfo('✗ Error: ' + error.message);
        }
        
      } else {
        addDebugInfo('✗ Map container not found');
      }
    } else {
      addDebugInfo('✗ Leaflet not loaded');
    }
  </script>
</body>
</html>
