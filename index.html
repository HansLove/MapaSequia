<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Simulador de Sequía en México</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div class="control-panel">
    <h2>🌵 Simulador de Sequía en México</h2>
    
    <div class="time-control">
      <label for="timeSlider">Tiempo (2020 - 2050)</label>
      <input type="range" id="timeSlider" class="time-slider" min="0" max="371" value="185" />
      <div class="time-display">
        <span>2020-01</span>
        <span class="current-time" id="currentTime">2035-06</span>
        <span>2050-12</span>
      </div>
    </div>

    <div class="controls-row">
      <button id="playButton" class="control-btn">▶️ Reproducir</button>
      <button id="resetButton" class="control-btn">🔄 Reiniciar</button>
    </div>

    <div class="speed-control">
      <label for="speedControl">Velocidad de Animación:</label>
      <select id="speedControl" class="speed-select">
        <option value="200">Lenta</option>
        <option value="100" selected>Normal</option>
        <option value="50">Rápida</option>
        <option value="25">Muy Rápida</option>
      </select>
    </div>

    <div id="statistics" class="statistics">
      <!-- Statistics will be populated by JavaScript -->
    </div>
  </div>

  <div class="legend">
    <h3>Niveles de Sequía</h3>
    <div class="legend-item">
      <div class="legend-color normal"></div>
      <span>Normal</span>
    </div>
    <div class="legend-item">
      <div class="legend-color d0"></div>
      <span>D0 - Anormalmente Seco</span>
    </div>
    <div class="legend-item">
      <div class="legend-color d1"></div>
      <span>D1 - Sequía Moderada</span>
    </div>
    <div class="legend-item">
      <div class="legend-color d2"></div>
      <span>D2 - Sequía Severa</span>
    </div>
    <div class="legend-item">
      <div class="legend-color d3"></div>
      <span>D3 - Sequía Extrema</span>
    </div>
    <div class="legend-item">
      <div class="legend-color d4"></div>
      <span>D4 - Sequía Excepcional</span>
    </div>
  </div>

  <div class="credits">
    Basado en el Monitor de Sequía en México (SMN-CONAGUA) | Proyecciones Climáticas 2025-2050
  </div>

  <!-- Modular JavaScript -->
  <script type="module" src="js/app.js"></script>
  
  <!-- Debug Script -->
  <script>
    console.log('Debug: HTML loaded');
    
    // Check if basic elements exist
    document.addEventListener('DOMContentLoaded', () => {
      console.log('Debug: DOM loaded');
      
      const mapContainer = document.getElementById('map');
      console.log('Debug: Map container:', mapContainer);
      console.log('Debug: Map container dimensions:', mapContainer ? mapContainer.offsetWidth + 'x' + mapContainer.offsetHeight : 'not found');
      
      // Check if Leaflet is loaded
      if (typeof L !== 'undefined') {
        console.log('Debug: Leaflet is available');
        
        // Try to create a simple map
        try {
          const testMap = L.map('map').setView([23.6345, -102.5528], 5);
          console.log('Debug: Test map created successfully');
          
          L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO'
          }).addTo(testMap);
          console.log('Debug: Test tile layer added');
          
        } catch (error) {
          console.error('Debug: Error creating test map:', error);
        }
      } else {
        console.error('Debug: Leaflet not available');
      }
    });
  </script>
</body>
</html>
